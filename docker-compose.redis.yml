# Local Redis for development (playback event queue, progress cache).
# Usage: docker compose -f docker-compose.redis.yml up -d
# Then REDIS_URL=redis://127.0.0.1:6379 in .env

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes

volumes:
  redis-data:
